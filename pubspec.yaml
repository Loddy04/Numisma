name: numisma
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  bcrypt: ^1.2.0
  crop_your_image: ^2.0.1
  crypto: ^3.0.7
  encrypt: ^5.0.3
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_local_notifications: ^22.3.2
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  image_picker: ^1.2.4
  local_auth: ^3.0.2
  path: ^1.9.1
  path_provider: ^2.1.6
  sensors_plus: ^7.1.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.4+2
  timezone: ^0.11.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/seed/currencies_seed.json
    - assets/seed/coins_seed.json
    - assets/logo/logo_numisma_1024.png

# Ikon aplikasi (launcher). Dibuat ulang dengan:
#   dart run flutter_launcher_icons
# Latar ikon adaptif memakai warna perunggu tema; foreground sudah punya
# ruang kosong di sekelilingnya, jadi inset tambahan dibuat 0.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo/logo_numisma_1024.png"
  min_sdk_android: 21
  adaptive_icon_background: "#8C6239"
  adaptive_icon_foreground: "assets/logo/icon_foreground_1024.png"
  adaptive_icon_foreground_inset: 0
